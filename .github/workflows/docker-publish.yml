name: Docker Publish

# Builds and pushes the official runtime image
# ghcr.io/objectstack-ai/objectstack from docker/Dockerfile.
#
# Two entry points:
#   - workflow_call: invoked by release.yml right after a successful
#     `changeset publish`, with the just-published @objectstack/cli version.
#     (A plain `on: push: tags:` trigger would never fire — the release
#     workflow pushes its tags with GITHUB_TOKEN, and GitHub suppresses
#     workflow triggers from GITHUB_TOKEN-pushed refs.)
#   - workflow_dispatch: manual backfill / rebuild of an already-published
#     version, e.g. to pick up node:22-slim base-image CVE patches between
#     framework releases.
#
# The image tag always equals the @objectstack/cli version baked inside.

on:
  workflow_call:
    inputs:
      version:
        description: 'Published @objectstack/cli version to package (e.g. 14.8.0)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: '@objectstack/cli version to package (e.g. 14.8.0) — must already be on npm'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build & push ghcr.io/objectstack-ai/objectstack
    runs-on: ubuntu-latest
    # Job wall, all four readings on record: 3.5 and 3.5 min (the two dispatch runs), 4.3
    # min (18.1.0, Release run 40078805767, attempt 2) and 1.4 min (attempt 1, red). Four
    # readings make p99 the max, 4.3; the bound is wide because the image is built for two
    # platforms, arm64 under QEMU, and a cold layer cache is unmeasured.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/objectstack-ai/objectstack
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate version input
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a valid semver version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait until npm serves the CLI's install tree
        # On a release, this job starts about a minute after `changeset
        # publish` returns. npm can still answer 404 for some of the group's
        # tarballs at that point, and the image build's `npm install -g` then
        # fails (18.1.0: spec-18.1.0.tgz, run 40078805767, #25613). So poll the
        # registry before building: walk @objectstack/cli@VERSION's
        # @objectstack/* dependency tree, and wait until every manifest and
        # tarball answers 200. The wait is bounded at 10 minutes, and on a
        # timeout the error names each package still missing. A rebuild of a
        # version that is already out passes at once.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node --input-type=module - <<'NODE'
          const version = process.env.VERSION;
          const registry = 'https://registry.npmjs.org';
          const deadline = Date.now() + 10 * 60 * 1000;
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          // A lockstep group: an @objectstack/* range names the version it was
          // published with (`^18.1.0` or `18.1.0`), so strip the operator.
          const pinOf = (range) => range.replace(/^[\^~=v]+/, '');
          // A network error counts as a miss and is retried like a 404.
          async function ready(name, ver) {
            try {
              const res = await fetch(`${registry}/${name.replace('/', '%2f')}/${ver}`);
              if (!res.ok) return null;
              const manifest = await res.json();
              const tarball = await fetch(manifest.dist.tarball, { method: 'HEAD' });
              return tarball.ok ? manifest : null;
            } catch {
              return null;
            }
          }
          const seen = new Map();
          let pending = [['@objectstack/cli', version]];
          let delay = 5000;
          while (pending.length > 0) {
            const missing = [];
            const found = [];
            for (const [name, ver] of pending) {
              const manifest = await ready(name, ver);
              if (!manifest) { missing.push([name, ver]); continue; }
              seen.set(name, ver);
              for (const [dep, range] of Object.entries(manifest.dependencies ?? {})) {
                if (dep.startsWith('@objectstack/') && !seen.has(dep)
                    && ![...pending, ...found].some(([n]) => n === dep)) {
                  found.push([dep, pinOf(range)]);
                }
              }
            }
            pending = [...missing, ...found];
            // Newly found dependencies are read at once; only a miss waits.
            if (missing.length === 0) continue;
            if (Date.now() + delay > deadline) {
              for (const [name, ver] of missing) {
                console.log(`::error::npm does not serve ${name}@${ver} (manifest or tarball) after 10 minutes`);
              }
              process.exit(1);
            }
            console.log(`waiting ${delay / 1000}s for ${missing.length} package(s): ${missing.map(([n, v]) => `${n}@${v}`).join(', ')}`);
            await sleep(delay);
            delay = Math.min(delay * 2, 60000);
          }
          console.log(`npm serves @objectstack/cli@${version} and ${seen.size - 1} @objectstack/* dependencies.`);
          NODE

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Tag = CLI version. Rolling minor/major/latest tags move with every
          # publish; prereleases (x.y.z-rc.1) get only their exact tag.
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(steps.version.outputs.version, '-') }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            OS_CLI_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke-test the pushed image (amd64)
        # `os --version` proves the CLI resolved, installed, and runs on the
        # pushed image; a boot test needs an artifact + DB and belongs to the
        # examples/e2e suites, not here.
        #
        # The `require()` line proves the SQL drivers are actually IN the built
        # image. `check:docs-image-tag` cannot see that: it compares the
        # Dockerfile install line against README.md's published table, and both
        # would still agree if the drivers vanished from the image. The class
        # has already cost a boot once -- docker/Dockerfile records that a tree
        # without `pg` "died at boot on `Cannot find module 'pg'`", which is why
        # the install line exists. `require()` needs no artifact and no
        # database, so it stays on the right side of the same line drawn above.
        #
        # `-w` is load-bearing, not incidental. `npm install -g` puts the
        # drivers in /usr/local/lib/node_modules, which is NOT on `require()`'s
        # search path from this image's WORKDIR (/srv/app): node's global
        # folders are $PREFIX/lib/node, and the node:22-slim base sets no
        # NODE_PATH. Run from /srv/app the probe fails on a CORRECT image, so
        # it would be a constant red rather than a check. Resolving from inside
        # the global tree is also how the real boot path resolves them --
        # driver-sql lives there too. Do not "simplify" this to a bare
        # `docker run`; verified in both directions before it landed.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker pull "$IMAGE:$VERSION"
          docker run --rm "$IMAGE:$VERSION" os --version
          docker run --rm -w /usr/local/lib/node_modules "$IMAGE:$VERSION" \
            node -e "require('pg'); require('mysql2')"
