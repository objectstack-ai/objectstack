name: Feature request
description: Something ObjectOS should do that it does not do today.
body:
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      description: Which ObjectOS edition do you want this in?
      options:
        - ObjectOS Community (self-hosted, this repository's code)
        - ObjectOS Cloud (cloud.objectos.ai)
        - ObjectOS Enterprise (licensed, self-managed)
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `os --version`, or the build shown under About in the Console's help menu.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened / What you expected
      description: What ObjectOS does today, and what you expected it to do instead.
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: The steps that take you to the place where the feature is missing.
      placeholder: |
        1.
        2.
        3.
