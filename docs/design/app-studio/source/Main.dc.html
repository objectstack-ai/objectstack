<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Studio 对象列表（改版）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#18181B;text-decoration:none}a:hover{color:#18181B;text-decoration:underline}
button{font:inherit}
</style>
</helmet>
<div style="display: flex; flex-direction: column; min-height: 900px; background: #FFFFFF; color: #1C1917; font-family: Inter, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif; font-size: 14px">

  <div style="display: flex; flex-wrap: wrap; flex: 1">

    <nav aria-label="Studio 菜单" style="position: relative; flex: 1 1 248px; max-width: 100%; box-sizing: border-box; background: #F7F7F5; border-right: 1px solid #E7E5E4; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 2px 0 4px">
        <span aria-hidden="true" style="flex: 0 0 auto; width: 28px; height: 28px; border-radius: 8px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM16.5 13v7M13 16.5h7"></path></svg>
        </span>
        <span style="flex: 1; min-width: 0; font-weight: 700; font-size: 15px; color: #1C1917; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{brandName}}</span>
        <button aria-label="折叠菜单" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 8px; color: #57534E; cursor: pointer">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4zM10 4v16"></path></svg>
        </button>
      </div>
      <div style="display: flex; align-items: center; gap: 4px; height: 40px; padding: 0 2px 0 0; margin-top: 2px; border-top: 1px solid #ECEAE6">
        <a href="#" title="返回应用：销售" aria-label="返回应用：销售" style="flex: 0 0 auto; width: 30px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #44403C">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
        </a>
        <button aria-haspopup="listbox" aria-expanded="{{menuOpenStr}}" aria-label="切换软件包：当前 销售（只读）" style="{{switchStyle}}">
          <span style="flex: 0 0 auto; width: 20px; height: 20px; border-radius: 5px; background: {{appColor}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600">销</span>
          <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">销售</span>
          <span title="只读应用：你的修改会存到它的定制包" style="flex: 0 0 auto; display: flex; color: #6B6762">
            <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3"></path></svg>
          </span>
          <span style="flex: 1"></span>
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#57534E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"></path></svg>
        </button>
      </div>
      <div style="height: 8px"></div>
      <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
        <div role="listbox" aria-label="切换软件包" style="position: absolute; top: 98px; left: 10px; width: 300px; z-index: 10; background: #FFFFFF; border: 1px solid #E7E5E4; border-radius: 12px; box-shadow: 0 12px 32px rgba(28, 25, 23, 0.14); padding: 6px; display: flex; flex-direction: column; gap: 2px">
          <label style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; margin-bottom: 4px; border-bottom: 1px solid #F1F0EE; color: #6B6762">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"></path></svg>
            <input placeholder="搜索软件包" aria-label="搜索软件包" style="border: 0; outline: 0; background: transparent; font: inherit; color: #1C1917; flex: 1; min-width: 0">
          </label>
          <sc-for list="{{pkgs}}" as="p" hint-placeholder-count="4">
            <button role="option" aria-selected="{{p.selected}}" style="{{p.style}}">
              <span style="{{p.tileStyle}}">{{p.letter}}</span>
              <span style="display: flex; flex-direction: column; flex: 1; min-width: 0; text-align: left">
                <span style="font-weight: 500; color: #1C1917">{{p.name}}</span>
                <span style="font-size: 12px; color: #6B6762">{{p.sub}}</span>
              </span>
              <span style="{{p.checkStyle}}">
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
              </span>
            </button>
          </sc-for>
          <div style="height: 1px; background: #F1F0EE; margin: 4px 6px"></div>
          <button style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #1C1917; font-size: 14px; font-weight: 500; cursor: pointer">
            <span style="width: 26px; height: 26px; border-radius: 7px; border: 1px dashed #A8A29E; display: flex; align-items: center; justify-content: center; color: #44403C">
              <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
            </span>
            新建软件包
          </button>
        </div>
      </sc-if>
      <label style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; background: #FFFFFF; border: 1px solid #E7E5E4; border-radius: 8px; color: #6B6762; margin-bottom: 8px">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"></path></svg>
        <input placeholder="搜索菜单" aria-label="搜索菜单" style="border: 0; outline: 0; background: transparent; font: inherit; color: #1C1917; flex: 1; min-width: 0">
        <span style="font-size: 11px; color: #6B6762; border: 1px solid #E7E5E4; border-radius: 4px; padding: 0 4px">⌘K</span>
      </label>
      <a href="#" style="{{ovRowStyle}}">
        <span aria-hidden="true" style="{{ovBarStyle}}"></span>
        <span style="{{ovIconStyle}}">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5zM3 7.5l9 4.5 9-4.5M12 12v9"></path></svg>
        </span>
        <span style="flex: 1">概览</span>
        <span title="有 3 个未发布的改动" style="font-size: 11px; font-weight: 600; color: #92400E; background: #FEF3C7; padding: 1px 7px; border-radius: 999px">3</span>
      </a>
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
        <div style="display: flex; flex-direction: column; gap: 2px; margin-top: 10px">
          <button aria-expanded="true" style="display: flex; align-items: center; height: 30px; padding: 0 8px 0 10px; border: 0; background: transparent; border-radius: 6px; font-size: 13px; font-weight: 500; color: #6B6762; cursor: pointer">
            <span style="flex: 1; text-align: left">{{g.label}}</span>
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
          </button>
          <sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
            <a href="#" style="{{it.rowStyle}}">
              <span aria-hidden="true" style="{{it.barStyle}}"></span>
              <span style="{{it.iconBoxStyle}}">
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{it.icon}}"></path></svg>
              </span>
              <span style="flex: 1">{{it.label}}</span>
              <span style="{{it.countStyle}}">{{it.count}}</span>
            </a>
          </sc-for>
        </div>
      </sc-for>
      <div style="height: 1px; background: #E7E5E4; margin: 12px 4px 4px"></div>
      <button style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border: 0; background: transparent; color: #44403C; border-radius: 8px; text-align: left; cursor: pointer">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
        高级
      </button>
    </nav>

    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
      <sc-if value="{{isOverview}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; gap: 12px; padding: 16px 24px 0; flex-wrap: wrap">
          <span style="width: 40px; height: 40px; border-radius: 10px; background: {{appColor}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 17px">销</span>
          <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
              <h1 style="margin: 0; font-size: 20px; font-weight: 600">销售</h1>
              <span title="系统自带的应用不能直接修改，你的修改会单独保存" style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: #44403C; background: #F1F1EF; padding: 2px 8px; border-radius: 999px">
                <svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3"></path></svg>
                系统自带
              </span>
              <span style="font-size: 12px; font-weight: 500; color: #166534; background: #DCFCE7; padding: 2px 8px; border-radius: 999px">使用中</span>
            </div>
            <div style="font-size: 13px; color: #57534E">客户、商机、合同和订单的全流程管理</div>
          </div>
          <div style="flex: 1"></div>
          <button style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border: 1px solid #D6D3D1; border-radius: 8px; background: #FFFFFF; color: #1C1917; font-weight: 500; cursor: pointer">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>
            导出
          </button>
          <button aria-label="更多操作：编辑信息、复制一份、停用、删除" title="编辑信息 · 复制一份 · 停用 · 删除" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 1px solid #D6D3D1; border-radius: 8px; background: #FFFFFF; color: #1C1917; cursor: pointer">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg>
          </button>        </div>
        <div role="tablist" aria-label="概览" style="display: flex; gap: 24px; padding: 0 24px; margin-top: 14px; border-bottom: 1px solid #E7E5E4">
          <sc-for list="{{ovTabs}}" as="t" hint-placeholder-count="4">
            <button role="tab" aria-selected="{{t.selected}}" style="{{t.style}}">{{t.label}}</button>
          </sc-for>
        </div>
        <div style="padding: 20px 24px 32px; max-width: 880px; box-sizing: border-box">
          <div style="display: flex; flex-direction: column; gap: 16px">
            <section style="border: 1px solid #E7E5E4; border-radius: 12px; padding: 16px 18px">
              <h2 style="margin: 0 0 10px; font-size: 15px; font-weight: 600">基本信息</h2>
              <sc-for list="{{infoRows}}" as="i" hint-placeholder-count="7">
                <div style="display: flex; gap: 12px; padding: 8px 0; border-top: 1px solid #F5F5F4; font-size: 14px">
                  <span style="flex: 0 0 96px; color: #57534E">{{i.k}}</span>
                  <span style="{{i.vStyle}}">{{i.v}}</span>
                </div>
              </sc-for>
              <details style="margin-top: 8px; border-top: 1px solid #F5F5F4; padding-top: 8px">
                <summary style="cursor: pointer; font-size: 13px; color: #57534E">技术信息</summary>
                <div style="display: flex; flex-direction: column; gap: 6px; padding: 8px 0 0; font-size: 13px">
                  <div style="display: flex; gap: 12px"><span style="flex: 0 0 96px; color: #6B6762">软件包 ID</span><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; color: #44403C">com.example.crm</span></div>
                  <div style="display: flex; gap: 12px"><span style="flex: 0 0 96px; color: #6B6762">命名空间</span><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; color: #44403C">crm</span></div>
                  <div style="display: flex; gap: 12px"><span style="flex: 0 0 96px; color: #6B6762">类型</span><span style="color: #44403C">代码包（随部署发布）</span></div>
                </div>
              </details>
            </section>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{isList}}" hint-placeholder-val="{{ true }}">

      <div style="display: flex; align-items: center; gap: 10px; padding: 14px 24px 10px; flex-wrap: wrap">
        <div style="width: 30px; height: 30px; border-radius: 8px; background: #F1F1EF; color: #44403C; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v14H3zM3 10h18M9 10v9"></path></svg>
        </div>
        <h1 style="margin: 0; font-size: 18px; font-weight: 600">对象</h1>
        <div style="flex: 1"></div>
        <button title="新建的对象会存到「销售」的定制包" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border: 0; border-radius: 8px; background: {{accent}}; color: #FFFFFF; font-weight: 500; cursor: pointer">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
          新建对象
        </button>
        <button aria-label="更多：刷新、类型动作" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 8px; color: #44403C; cursor: pointer">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5h.01M12 12h.01M12 19h.01"></path></svg>
        </button>
        <button aria-label="帮助" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 8px; color: #57534E; cursor: pointer">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"></path></svg>
        </button>
      </div>

      <div style="display: flex; align-items: center; gap: 8px; padding: 0 24px 12px; flex-wrap: wrap; border-bottom: 1px solid #E7E5E4">
        <button aria-haspopup="listbox" aria-label="按来源筛选：全部来源" style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px 0 12px; border: 1px solid #E7E5E4; background: #FFFFFF; border-radius: 8px; color: #1C1917; font-size: 13px; font-weight: 500; cursor: pointer">
          全部来源
          <span style="font-size: 12px; font-weight: 400; color: #6B6762; font-variant-numeric: tabular-nums">{{total}}</span>
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#57534E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
        <label style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; width: 240px; max-width: 100%; box-sizing: border-box; border: 1px solid #E7E5E4; border-radius: 8px; color: #6B6762; font-size: 13px">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"></path></svg>
          <input placeholder="搜索名称或描述" aria-label="搜索名称或描述" style="border: 0; outline: 0; background: transparent; font: inherit; color: #1C1917; flex: 1; min-width: 0">
        </label>
        <div style="flex: 1"></div>
      </div>

      <div style="overflow-x: auto">
        <table style="width: 100%; min-width: 720px; border-collapse: collapse">
          <thead>
            <tr style="height: 40px; color: #57534E; font-size: 13px; font-weight: 500; text-align: left">
              <th style="padding: 0 24px; font-weight: 500; border-bottom: 1px solid #E7E5E4; width: 260px"><button style="display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; padding: 0; font: inherit; color: #1C1917; cursor: pointer">名称 <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button></th>
              <th style="padding: 0 16px; font-weight: 500; border-bottom: 1px solid #E7E5E4; text-align: right; width: 80px">字段</th>
              <th style="padding: 0 16px; font-weight: 500; border-bottom: 1px solid #E7E5E4">描述</th>
              <sc-if value="{{withCustom}}" hint-placeholder-val="{{ false }}">
                <th style="padding: 0 16px; font-weight: 500; border-bottom: 1px solid #E7E5E4; width: 120px">修改时间</th>
                <th style="padding: 0 24px 0 16px; font-weight: 500; border-bottom: 1px solid #E7E5E4; width: 96px">来源</th>
              </sc-if>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="11">
              <tr style="height: 56px">
                <td style="padding: 6px 24px; border-bottom: 1px solid #F1F0EE">
                  <div style="display: flex; align-items: center; gap: 10px">
                    <span aria-hidden="true" style="{{r.tileStyle}}">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg>
                    </span>
                    <div style="min-width: 0">
                      <a href="#" style="display: block; font-weight: 500; color: {{accent}}">{{r.label}}</a>
                      <div style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: #6B6762; margin-top: 2px">{{r.name}}</div>
                    </div>
                  </div>
                </td>
                <td style="padding: 0 16px; border-bottom: 1px solid #F1F0EE; text-align: right; font-variant-numeric: tabular-nums">{{r.fields}}</td>
                <td style="padding: 0 16px; border-bottom: 1px solid #F1F0EE; color: #44403C; max-width: 520px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.desc}}</td>
                <sc-if value="{{withCustom}}" hint-placeholder-val="{{ false }}">
                  <td style="padding: 0 16px; border-bottom: 1px solid #F1F0EE; color: #57534E; font-size: 13px">{{r.changed}}</td>
                  <td style="padding: 0 24px 0 16px; border-bottom: 1px solid #F1F0EE">
                    <span style="{{r.badgeStyle}}">{{r.source}}</span>
                  </td>
                </sc-if>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
      <div style="padding: 12px 24px; color: #57534E; font-size: 13px">{{total}} 条记录</div>
      </sc-if>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#18181B","options":["#18181B","#047857","#4F46E5"]},"appColor":{"editor":"color","default":"#C2410C"},"brandName":{"editor":"enum","default":"App Studio","options":["App Studio","Object Studio","ObjectStack Studio","应用搭建"]},"withCustom":{"editor":"boolean","default":false},"menuOpen":{"editor":"boolean","default":false},"page":{"editor":"enum","default":"list","options":["list","overview"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#18181B';
    const appColor = this.props.appColor ?? '#C2410C';
    const page = this.props.page ?? 'list';
    const isOverview = page === 'overview';
