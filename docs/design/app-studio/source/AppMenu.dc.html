<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Studio 应用名下拉菜单</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; min-height: 900px; font-family: Inter, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif; color: #1C1917">
  <dc-import name="Main" menu-open="{{ true }}" accent="{{accent}}" hint-size="100%,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#18181B","options":["#18181B","#047857","#4F46E5"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#18181B' };
  }
}
</script>
</body>
</html>
