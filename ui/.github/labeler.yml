# Configuration for pull-requests labeler
# https://github.com/actions/labeler

# Packages — one entry per directory under `packages/`, EXCEPT `plugin-*` and
# `data-*`, which are covered by the `plugin` and `data-adapter` families below.
# A package with no entry here draws no label, so its PRs are invisible to any
# sweep keyed on `package: *` (objectui#7746). `scripts/__tests__/labeler-package-coverage.test.ts`
# fails when a directory under `packages/` draws nothing.
'package: core':
  - changed-files:
    - any-glob-to-any-file: 'packages/core/**/*'

'package: types':
  - changed-files:
    - any-glob-to-any-file: 'packages/types/**/*'

'package: react':
  - changed-files:
    - any-glob-to-any-file: 'packages/react/**/*'

'package: components':
  - changed-files:
    - any-glob-to-any-file: 'packages/components/**/*'

'package: app-shell':
  - changed-files:
    - any-glob-to-any-file: 'packages/app-shell/**/*'

'package: auth':
  - changed-files:
    - any-glob-to-any-file: 'packages/auth/**/*'

'package: cli':
  - changed-files:
    - any-glob-to-any-file: 'packages/cli/**/*'

'package: collaboration':
  - changed-files:
    - any-glob-to-any-file: 'packages/collaboration/**/*'

'package: create-plugin':
  - changed-files:
    - any-glob-to-any-file: 'packages/create-plugin/**/*'

'package: fields':
  - changed-files:
    - any-glob-to-any-file: 'packages/fields/**/*'

'package: i18n':
  - changed-files:
    - any-glob-to-any-file: 'packages/i18n/**/*'

'package: layout':
  - changed-files:
    - any-glob-to-any-file: 'packages/layout/**/*'

'package: mobile':
  - changed-files:
    - any-glob-to-any-file: 'packages/mobile/**/*'

'package: permissions':
  - changed-files:
    - any-glob-to-any-file: 'packages/permissions/**/*'

'package: providers':
  - changed-files:
    - any-glob-to-any-file: 'packages/providers/**/*'

'package: react-runtime':
  - changed-files:
    - any-glob-to-any-file: 'packages/react-runtime/**/*'

'package: runner':
  - changed-files:
    - any-glob-to-any-file: 'packages/runner/**/*'

'package: sdui-parser':
  - changed-files:
    - any-glob-to-any-file: 'packages/sdui-parser/**/*'

# Plugins
'plugin':
  - changed-files:
    - any-glob-to-any-file: 'packages/plugin-*/**/*'

'plugin: charts':
  - changed-files:
    - any-glob-to-any-file: 'packages/plugin-charts/**/*'

'plugin: editor':
  - changed-files:
    - any-glob-to-any-file: 'packages/plugin-editor/**/*'

'plugin: kanban':
  - changed-files:
    - any-glob-to-any-file: 'packages/plugin-kanban/**/*'

'plugin: markdown':
  - changed-files:
    - any-glob-to-any-file: 'packages/plugin-markdown/**/*'

# Data adapters
'data-adapter':
  - changed-files:
    - any-glob-to-any-file: 'packages/data-*/**/*'

# Documentation
# `content/**` is the published docs site; `docs/**` is the internal tree. Without the
# `content/**` glob a PR touching only the published site drew no label at all
# (objectui#10012). `scripts/__tests__/labeler-package-coverage.test.ts` fails if it goes.
'documentation':
  - changed-files:
    - any-glob-to-any-file: 
      - 'docs/**/*'
      - 'content/**/*'
      - '*.md'
      - 'packages/**/README.md'

# Tests
'tests':
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - '**/*.spec.ts'
      - '**/*.spec.tsx'
      - '**/test/**/*'
      - '**/tests/**/*'
      - '**/__tests__/**/*'

# Configuration
'configuration':
  - changed-files:
    - any-glob-to-any-file:
      - '*.config.*'
      - '.*rc'
      - '.*rc.*'
      - '.github/**/*'
      - 'tsconfig*.json'
      - 'package.json'
      - 'pnpm-workspace.yaml'

# Dependencies
'dependencies':
  - changed-files:
    - any-glob-to-any-file:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '**/package.json'

# Examples
'examples':
  - changed-files:
    - any-glob-to-any-file: 'examples/**/*'

# Applications
'apps':
  - changed-files:
    - any-glob-to-any-file: 'apps/**/*'

# CI/CD
'ci/cd':
  - changed-files:
    - any-glob-to-any-file: '.github/workflows/**/*'

# Breaking changes (when certain files are modified)
'breaking-change':
  - changed-files:
    - any-glob-to-any-file:
      - 'packages/types/src/schema/**/*'
      - 'packages/core/src/public-api.ts'
